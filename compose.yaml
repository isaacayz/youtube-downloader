name: local-media-downloader

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MEDIA_ROOT: ${MEDIA_ROOT:-/downloads}
      STAGING_DIR: ${STAGING_DIR:-/staging}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      MAX_OUTPUT_BYTES: ${MAX_OUTPUT_BYTES:-5368709120}
      MAX_JOB_DURATION_SECONDS: ${MAX_JOB_DURATION_SECONDS:-3600}
      MAX_REDIRECTS: ${MAX_REDIRECTS:-3}
      JOB_RETRY_MAX: ${JOB_RETRY_MAX:-3}
      OUTPUT_RETENTION_DAYS: ${OUTPUT_RETENTION_DAYS:-7}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      ENABLE_LAN_ACCESS: ${ENABLE_LAN_ACCESS:-false}
      ENABLE_YOUTUBE_DOWNLOAD: ${ENABLE_YOUTUBE_DOWNLOAD:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/staging:/staging
      - ./data/downloads:/downloads:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MEDIA_ROOT: ${MEDIA_ROOT:-/downloads}
      STAGING_DIR: ${STAGING_DIR:-/staging}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_YOUTUBE_DOWNLOAD: ${ENABLE_YOUTUBE_DOWNLOAD:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/staging:/staging
      - ./data/downloads:/downloads
    networks:
      - backend
      - egress
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mediaapp
      POSTGRES_USER: mediaapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaapp -d mediaapp"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

networks:
  frontend: {}
  backend:
    internal: true
  egress: {}

volumes:
  postgres-data:
  redis-data:
